[package]
name = "roto"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = [
  "/.github",
  "/.forgejo",
  "/tooling",
]

[[bin]]
name = "roto"
path = "src/main.rs"
required-features = ["cli"]
test = false
bench = false

[features]
default = ["cli"]
cli = ["clap"]
logger = ["env_logger"]
disas = ["cranelift-codegen/disas"]

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.5.54", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
unicode-ident = "1.0.22"
inetnum = "0.1.0"
log = "0.4"
roto-macros = { workspace = true }
symbol_table = { version = "0.5.0", features = ["global"] }
rustc-literal-escaper = "0.0.7"
libc = "0.2"
sealed = "0.6.0"
indexmap = "2.14.0"
unicode-width = "0.2.2"
diffy = { version = "0.5.1", features = ["color"] }

[dependencies.cranelift]
version = "0.136.0"
features = ["frontend", "jit", "module", "native"]

[dependencies.cranelift-codegen]
version = "0.136.0"

[dependencies.cranelift-jit]
version = "0.136.0"

[dev-dependencies]
assert_cmd = { version = "2.2.0", features = ["color"] }
criterion = "0.8.2"
insta = { version = "1.46.0", features = ["glob"] }
rand = "0.10.2"
pretty_assertions = "1.4.1"
routecore = { version = "0.7", features = ["bgp", "bmp", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"

[profile.profiling]
inherits = "release"
lto = true
strip = "none"
debug = "full"

[package.metadata.cargo-shear]
ignored = ["cranelift-jit"]

[workspace]
members = ["macros"]

[workspace.package]
version = "0.13.0"
edition = "2024"
authors = ["NLnet Labs <routing-team@nlnetlabs.nl>"]
license = "BSD-3-Clause"
rust-version = "1.96"
description = "a statically-typed, compiled, embedded scripting language"
documentation = "https://docs.rs/roto/"
repository = "https://codeberg.org/NLnetLabs/roto/"
homepage = "https://www.nlnetlabs.nl/projects/routing/rotonda/"
keywords = ["scripting", "language", "scripting-language", "routing", "bgp"]
categories = ["compilers", "network-programming"]
readme = "README.md"

[workspace.dependencies]
roto-macros = { path = "macros", version = "=0.13.0" }

[[bench]]
name = "fibonacci"
harness = false

[[bench]]
name = "insertion_sort"
harness = false

[[bench]]
name = "primes"
harness = false

[[bench]]
name = "script_bench_rs"
harness = false

[lints.clippy]
as_pointer_underscore = "warn"
as_underscore = "warn"
borrow_as_ptr = "warn"
cargo_common_metadata = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_broken_link = "warn"
doc_comment_double_space_linebreaks = "warn"
doc_link_with_quotes = "warn"
implicit_clone = "warn"
literal_string_with_formatting_args = "warn"
significant_drop_in_scrutinee = "warn"
todo = "warn"
unchecked_time_subtraction = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# multiple_crate_versions = "warn"
# let_underscore_untyped = "warn"
# missing_fields_in_debug = "warn"
# missing_panics_doc = "warn"
# return_self_not_must_use = "warn"
# undocumented_unsafe_blocks = "warn"
# significant_drop_tightening = "warn"
# string_slice = "warn"
# indexing_slicing = "warn"
# unwrap_used = "warn"
# panic = "warn"
# get_unwrap = "warn"
# unwrap_in_result = "warn"
# panic_in_result_fn = "warn"
