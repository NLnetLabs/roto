name: Pull Request
about: Submit a Pull Request
body:
  - type: checkboxes
    id: terms
    visible: [form]
    attributes:
      label: Code of Conduct & LLM Policy
      description: |
        Thank you for contributing to Roto! To submit a PR you must agree to the following terms.
      options:
        - label: I agree to follow the [NLnet Labs Code of Conduct](https://www.nlnetlabs.nl/conduct/).
          required: true
        - label: This PR follows the [NLnet Labs LLM Policy].
          required: true
        - label: I have read Roto's [CONTRIBUTING.MD](https://codeberg.org/NLnetLabs/roto/src/branch/main/CONTRIBUTING.md).
          required: true
  - type: textarea
    attributes:
      label: Description
      description: Please describe your change.
      value: |

        Closes #XXX
